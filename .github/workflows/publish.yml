name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Version from tag
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          "VERSION=$v" >> $env:GITHUB_ENV
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore -p:Version=$env:VERSION
      - run: dotnet test -c Release --no-build
      - run: dotnet pack src/tzdata.NET/tzdata.NET.csproj -c Release --no-build -p:Version=$env:VERSION -o artifacts
      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
